<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hustle City</title><link href="https://fonts.googleapis.com/css2?family=Bowlby+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f4c3a;--card:#fff;--ink:#17201f;--mut:#5d6d6a;--y:#ffc933;--r:#e63b2e;--g:#2fb36b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--card:#1d2f2b;--ink:#f3f1e8;--mut:#9db0ab}}
:root[data-theme=dark]{--card:#1d2f2b;--ink:#f3f1e8;--mut:#9db0ab}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}body{height:100%;margin:0;background:var(--bg);color:#fff;font:600 14px system-ui,sans-serif;overflow:hidden;touch-action:none}
#app{height:100%;display:flex;flex-direction:column}
#hud{padding:6px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#0a3528}
.pill{background:#0006;border-radius:20px;padding:6px 10px;white-space:nowrap;font-weight:800}
.money{background:var(--y);color:#17201f;font:16px 'Bowlby One',Impact,sans-serif}
.lo{color:#ff8a7e}.bar{height:7px;border-radius:5px;background:#0006;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--y)}
button{font:inherit;cursor:pointer}
.btn{min-height:44px;border:0;border-radius:12px;padding:10px 16px;background:var(--y);color:#17201f;font-weight:900;font-size:15px;box-shadow:0 4px 0 #b88a00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a00}.btn.g{background:var(--g);color:#fff;box-shadow:0 4px 0 #1b7a47}.btn.w{background:#fff;color:#17201f;box-shadow:0 4px 0 #aab}.btn.r{background:var(--r);color:#fff;box-shadow:0 4px 0 #9b2118}.btn[disabled]{opacity:.45}.btn.s{min-height:44px;padding:6px 10px;font-size:13px}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
canvas{display:block;border-radius:10px;background:#24413a}
#hint{position:absolute;top:4px;left:50%;transform:translateX(-50%);background:#000b;padding:6px 12px;border-radius:14px;max-width:94%;text-align:center;font-size:13px;pointer-events:none}
#toasts{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none;width:92%;z-index:20}
.toast{background:var(--y);color:#17201f;padding:7px 12px;border-radius:12px;font-weight:800;text-align:center;font-size:13px;animation:pop .25s}@keyframes pop{from{transform:scale(.8);opacity:0}}
#joy{position:absolute;left:12px;bottom:12px;width:128px;height:128px;border-radius:50%;background:#ffffff22;border:2px solid #fff5;touch-action:none}
#knob{position:absolute;left:44px;top:44px;width:40px;height:40px;border-radius:50%;background:#fffd;pointer-events:none}
#act{position:absolute;right:12px;bottom:16px;width:100px;height:100px;border-radius:50%;background:var(--r);color:#fff;border:4px solid #fff;font:12px 'Bowlby One',Impact,sans-serif;box-shadow:0 5px 0 #7d1b14;touch-action:none;padding:4px}
#ov{position:fixed;inset:0;display:none;background:#0a3528f5;overflow-y:auto;overflow-x:hidden;z-index:9;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));touch-action:pan-y}
.ttl{text-align:center;margin:6vh 0 22px}.ttl h1{font:15vw/.95 'Bowlby One',Impact,sans-serif;margin:14px 0 8px;color:var(--y);text-shadow:0 5px 0 #000a;letter-spacing:1px}.ttl p{font-size:18px;margin:0;color:#e8f5ee}
.stripe{display:block;height:22px;background:repeating-linear-gradient(45deg,var(--y) 0 18px,#17201f 18px 36px);border-radius:4px}
.col{display:flex;flex-direction:column;gap:12px;max-width:420px;margin:0 auto}
.card{background:var(--card);color:var(--ink);border-radius:16px;padding:14px;margin:0 auto 12px;max-width:520px}.card h2,.card h3{margin:0 0 8px;font-family:'Bowlby One',Impact,sans-serif;font-weight:400}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #8883}.row:last-child{border:0}.mut{color:var(--mut);font-size:12px;font-weight:600}
.pos{color:var(--g)}.neg{color:var(--r)}.lock{opacity:.55}
.tabs{display:flex;gap:4px;max-width:520px;margin:0 auto 10px}.tabs button{flex:1;min-height:48px;border:0;border-radius:10px;background:#0006;color:#fff;font-size:10px;padding:2px}.tabs button.on{background:var(--y);color:#17201f}.tabs span{display:block;font-size:18px}
.hdr{display:flex;justify-content:space-between;align-items:center;max-width:520px;margin:0 auto 10px}.btns{display:flex;gap:6px;flex-wrap:wrap}
#rot{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;font:24px 'Bowlby One',Impact,sans-serif;color:var(--y);padding:20px}
#rot span{font-size:70px;display:block;animation:rt 1.8s ease-in-out infinite}@keyframes rt{50%{transform:rotate(-90deg)}}
@media(orientation:portrait) and (pointer:coarse){#rot{display:flex}}
@media(max-height:480px){#hud{padding:3px 6px;gap:4px}.pill{padding:3px 8px;font-size:11px}.money{font-size:13px}.btn.s{min-height:40px;padding:3px 8px}#lvl{min-width:120px!important}#joy{width:112px;height:112px}#knob{left:36px;top:36px}#act{width:88px;height:88px;font-size:11px}#hint{font-size:11px;padding:3px 8px}}
input{-webkit-user-select:text;user-select:text;font:inherit;min-height:44px;width:100%;border-radius:10px;border:2px solid #8886;padding:8px;background:var(--card);color:var(--ink)}
</style></head><body>
<div id="app"><div id="hud"><span class="pill money" id="cash"></span><span class="pill" id="rep"></span><span class="pill" id="day"></span><button class="btn s" id="snd">🔊</button><button class="btn s" id="mn">☰</button>
<div class="pill" id="lvl" style="flex:1;min-width:150px"></div><div class="pill" id="pf"></div><div class="pill" id="inv"></div></div>
<div id="stage"><canvas id="cv"></canvas><div id="hint"></div><div id="joy"><div id="knob"></div></div><button id="act">GO</button></div></div>
<div id="rot"><span>📱</span>Rotate your phone<div style="font:600 14px system-ui;color:#fff">Hustle City plays in landscape</div></div><div id="toasts"></div><div id="ov"></div>
<script>
/* ===== CORE ===== */
const $=s=>document.querySelector(s),F=n=>'₦'+Math.round(n).toLocaleString('en-US'),R=(a,b)=>a+Math.random()*(b-a);
const W=640,H=384,KEY='hustleCityV1',DL=120,dpr=Math.min(2,devicePixelRatio||1);
let S,G={paused:1},SC=1,mute=false,AC,scr='';const esc=t=>String(t).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
function snd(f,d=.12,t='square',v=.05,s=0){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.value=f;if(s)o.frequency.linearRampToValueAtTime(f+s,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
const tune=(a,t='square')=>a.forEach((f,i)=>setTimeout(()=>snd(f,.14,t),i*110));
function toast(t,ms=2400){const d=document.createElement('div');d.className='toast';d.textContent=t;const b=$('#toasts');b.append(d);while(b.children.length>3)b.firstChild.remove();setTimeout(()=>d.remove(),ms)}
/* ===== BUSINESS REGISTRY (add new businesses here) ===== */
const BIZ=[{id:'food',e:'🍔',n:'Food Stand',cost:10000,diff:'Easy ★☆☆',profit:25000,d:'Cook burgers, serve hungry Lagos crowds.',on:1},
{id:'cloth',e:'👕',n:'Clothing Shop',cost:80000,diff:'Medium ★★☆',profit:40000,d:'Stock trendy fits for every budget.'},
{id:'phone',e:'📱',n:'Phone Shop',cost:150000,diff:'Hard ★★★',profit:70000,d:'Sell phones, repair screens, haggle.'},
{id:'barber',e:'💈',n:'Barbershop',cost:40000,diff:'Easy ★☆☆',profit:20000,d:'Fresh cuts, loyal regulars.'},
{id:'wash',e:'🚗',n:'Car Wash',cost:60000,diff:'Medium ★★☆',profit:30000,d:'Soap, shine and happy drivers.'},
{id:'laundry',e:'🧼',n:'Laundry',cost:50000,diff:'Easy ★☆☆',profit:22000,d:'Wash, fold, deliver on time.'}];
/* ===== FOOD STAND MODULE ===== */
const ING={bun:['🍞','Buns',150,'are'],meat:['🥩','Meat',400,'is'],lettuce:['🥬','Lettuce',80,'is'],sauce:['🧴','Sauce',60,'is'],drink:['🥤','Drinks',120,'are']};
const SUP=[{id:'local',n:'Local',e:'🛺',mult:1,qty:10,wait:25,lv:1},{id:'prem',n:'Premium',e:'🚚',mult:1.6,qty:20,wait:6,lv:1},{id:'whole',n:'Wholesale',e:'🏭',mult:.85,qty:40,wait:15,lv:3}];
const LV=[0,100,300,700,1500],NM=['Food Stand','Small Shop','Popular Shop','Restaurant','Premium Restaurant'];
const UP=[{id:'tables',c:'Shop',n:'🪑 More tables',$:20000,lv:1,fx:{slots:1},d:'+1 customer spot'},
{id:'decor',c:'Shop',n:'🎨 Better decoration',$:40000,lv:1,fx:{spawn:.15},d:'+15% customers'},
{id:'kitchen',c:'Shop',n:'🍳 Better kitchen',$:60000,lv:2,fx:{price:.05},d:'Sell price +5%'},
{id:'space',c:'Shop',n:'🏠 Bigger space',$:250000,lv:3,fx:{slots:2},d:'Upgrade location: +2 spots'},
{id:'stove',c:'Equipment',n:'🔥 Better stove',$:80000,lv:1,fx:{cook:.2,sweet:.03},d:'Cooking speed +20%'},
{id:'grill2',c:'Equipment',n:'⚡ Fast grill',$:150000,lv:3,fx:{cook:.2,sweet:.03},d:'Cooking speed +20%'},
{id:'fridge',c:'Equipment',n:'🧊 Larger fridge',$:30000,lv:1,fx:{cap:3},d:'Cook can stock 3 more burgers'},
{id:'flyers',c:'Marketing',n:'📄 Flyers',$:10000,lv:1,fx:{spawn:.1},d:'+10% customers'},
{id:'social',c:'Marketing',n:'📱 Social media',$:35000,lv:2,fx:{spawn:.2},d:'+20% customers'},
{id:'ads',c:'Marketing',n:'📻 Local advertising',$:90000,lv:3,fx:{spawn:.3},d:'+30% customers'}];
const UPD=Object.fromEntries(UP.map(u=>[u.id,u]));
const SF={cook:{e:'👨‍🍳',n:'Cook',s:15000,lv:2,d:'Cooks burgers for you'},cashier:{e:'👩‍💼',n:'Cashier',s:12000,lv:2,d:'Serves waiting customers'},cleaner:{e:'🧹',n:'Cleaner',s:8000,lv:3,d:'Keeps the shop clean'}};
const TY={pat:{e:'😊',p:50,m:1,r:1},imp:{e:'😡',p:22,m:1,r:1},big:{e:'💰',p:38,m:1.5,r:1},vip:{e:'⭐',p:40,m:2,r:3},bar:{e:'🤑',p:35,m:.8,r:1}};
const EV={fest:['📢 Food Festival!','Customer traffic +50% today.'],out:['⚡ Power Outage','Cooking is slower for 60 seconds.'],disc:['📦 Supplier Discount','Ingredients are 20% cheaper today.'],inf:['⭐ Food Influencer','A popular customer is visiting. Serve them well!']};
const MS=[['sale','🏆 First Sale',s=>s.sold>=1,2000],['k100','🏆 ₦100K Revenue',s=>s.revT>=1e5,5000],['c100','🏆 100 Customers',s=>s.served>=100,10000],['l5','🏆 Level 5 Business',s=>s.lv>=5,50000],['emp','🏆 First Employee',s=>Object.keys(s.staff).length>0,5000],['mil','🏆 First Million',s=>s.cash>=1e6,100000]];
const ST=[{k:'shelf',r:[24,32,64,40],l:'Ingredients',e:'🧺',c:'#c9822b'},{k:'grill',r:[128,32,64,40],l:'Grill',e:'🔥',c:'#555'},{k:'asm',r:[232,32,64,40],l:'Assemble',e:'🍔',c:'#9aa7a5'},{k:'fridge',r:[336,32,56,40],l:'Fridge',e:'🧊',c:'#cfe8f5'},{k:'sup',r:[440,32,64,40],l:'Supply desk',e:'📞',c:'#7a5cc7'},{k:'board',r:[540,32,64,40],l:'Upgrades',e:'📋',c:'#e0a800'},{k:'trash',r:[24,120,28,32],l:'Trash/clean',e:'🗑️',c:'#4a6670'},{k:'ctr',r:[96,160,512,32],l:'Serve',e:'💵',c:'#8a5a2b'}];
const SOLID=[[0,0,W,32],[0,0,16,H],[W-16,0,16,H],[0,H-16,288,16],[352,H-16,288,16],...ST.map(s=>s.r),[24,260,56,36],[560,260,56,36]];
const newS=()=>({cash:40000,xp:0,lv:1,inv:{bun:12,meat:10,lettuce:15,sauce:12,drink:20},rep:50,up:[],staff:{},day:1,served:0,sold:0,revT:0,ms:[],pend:[],bail:0,name:''});
const st=k=>S.up.reduce((a,id)=>a+(UPD[id].fx[k]||0),0),ev=id=>G.evId==id&&G.evOn;
const price=(k,s)=>Math.round(ING[k][2]*s.mult*(ev('disc')?.8:1)*s.qty);
const QM={perfect:1.2,good:1,under:.7};
const TB=[[24,260],[560,260],[24,320],[560,320]],seatPos=i=>[TB[i>>1][0]+14+(i&1)*28,TB[i>>1][1]+16],nseat=()=>(2+(st('slots')>=1)+(st('slots')>=3))*2;
function addXp(n){S.xp+=n;let l=1;LV.forEach((t,i)=>{if(S.xp>=t)l=i+1});if(l>S.lv){S.lv=l;toast('🎉 LEVEL UP! '+NM[l-1]+' — new upgrades unlocked',3500);tune([523,659,784,1046])}}
function fx(x,y,t,c='#fff'){G.fx.push({x,y,t,c,a:1})}
/* ===== DAY FLOW ===== */
function startDay(){const ids=Object.keys(EV),r=G.ready||0;G={c:[],t:DL,el:0,sp:1.5,ready:r,h:{kit:0,patty:null,burger:null,drink:0},cook:null,p:{x:320,y:110,w:0},fx:[],dirt:G.dirt||0,d:{rev:0,exp:0,ing:0,fix:0,cust:0,happy:0,rep0:S.rep},warn:{},evId:Math.random()<.65?ids[Math.random()*4|0]:null,evOn:0,tab:'sup',ck:0,cs:0,ot:0,hs:0,paused:0,outT:0};G.evAt=G.evId=='disc'?1:R(12,55);hide();toast(S.day==1?'🍔 Your first customer is on the way!':'☀️ Day '+S.day+' — open for business!')}
function endDay(){G.paused=1;G.between=1;const d=G.d;d.fix=5000+Object.keys(S.staff).reduce((a,k)=>a+SF[k].s,0);d.exp=d.ing+d.fix;S.cash=Math.max(0,S.cash-d.fix);if(S.cash<10000){S.cash+=20000;S.bail=S.day;d.aid=20000}d.repd=Math.round(S.rep-d.rep0);localStorage.setItem(KEY,JSON.stringify(S));cloudPush();tune([392,330,262],'triangle');showSum()}
function showSum(){const d=G.d,p=d.rev-d.exp;show(`<div class=ttl style="margin:2vh 0 14px"><h1 style="font-size:9vw">DAY COMPLETE</h1></div><div class=card><h3>Day ${S.day}</h3><div class=row><span>Revenue</span><b>${F(d.rev)}</b></div><div class=row><span>Ingredients</span><b>${F(d.ing)}</b></div><div class=row><span>Rent, power & salaries</span><b>${F(d.fix)}</b></div><div class=row><span>Expenses</span><b>${F(d.exp)}</b></div><div class=row><span>Profit</span><b class="${p<0?'neg':'pos'}">${F(p)}</b></div><div class=mut>Revenue − Expenses = Profit</div>${d.aid?'<div class=row><span>🤝 Family support</span><b class=pos>+'+F(d.aid)+'</b></div>':''}<div class=row><span>Customers served</span><b>${d.cust}</b></div><div class=row><span>Happy customers</span><b>${d.happy}</b></div><div class=row><span>Reputation</span><b>${d.repd>=0?'+':''}${d.repd}</b></div></div><div class=col><button class="btn w" data-a=shop>🛠 SUPPLIES & UPGRADES</button><button class="btn w" data-a=save>💾 SAVE GAME</button><button class=btn data-a=next>START NEXT DAY</button></div>`)}
/* ===== CLOUD (Claude db capability: signed-in viewers) ===== */
let CL=null,LB=null,cloudSave=null;
async function initCloud(){try{if(!window.claude||!claude.use)return;const db=await claude.use('db'),u=await claude.use('user');if(!db||!u)return;const id=await u.id();if(!id)return;CL={db,id};const d=await db.doc('data/users/'+id+'/save').get();if(d.exists)cloudSave=d.data();if(scr=='title')title()}catch(e){}}
async function cloudPush(){if(!CL)return 0;try{await CL.db.doc('data/users/'+CL.id+'/save').set({save:S,t:Date.now()});if(S.name)await CL.db.doc('scores/'+CL.id).set({name:S.name,revT:Math.round(S.revT),lv:S.lv,day:S.day,served:S.served,t:Date.now()});return 1}catch(e){toast('☁️ Cloud save needs Contributor access');return 0}}
async function fetchLB(){if(!CL)return;try{const q=await CL.db.collection('scores').orderBy('revT','desc').limit(10).get();LB=q.docs.map(d=>d.data())}catch(e){LB=[]}if(G.tab=='lb'&&G.paused&&$('#ov').style.display=='block'&&!document.activeElement.matches('input'))menu()}
/* ===== SCREENS ===== */
function show(h){const o=$('#ov'),y=o.scrollTop;o.innerHTML=h;o.style.display='block';o.scrollTop=y;G.paused=1;scr=''}
function hide(){$('#ov').style.display='none';G.paused=0}
function title(){G={paused:1};const sv=localStorage.getItem(KEY);show(`<div class=ttl><i class=stripe></i><h1>HUSTLE<br>CITY</h1><p>Start small. Build big.</p></div><div class=col><button class=btn data-a=play>PLAY</button>${sv?'<button class="btn g" data-a=cont>CONTINUE</button>':''}${cloudSave?'<button class="btn g" data-a=ccont>☁️ CONTINUE CLOUD SAVE</button>':''}<button class="btn w" data-a=how>HOW TO PLAY</button></div>`);scr='title'}
function how(){show(`<div class=card><h2>How to play</h2><p>🧺 <b>Grab ingredients</b> from the shelf.<br>🔥 <b>Grill</b> the meat — press INTERACT when the pointer is in the <b>green</b>.<br>🍔 <b>Assemble</b> at the prep station.<br>🥤 Grab a <b>drink</b> from the fridge.<br>💵 <b>Serve</b> at the counter to get paid. Customers then sit down, eat and leave.</p><p>📞 Restock at the Supply desk. 📋 Buy upgrades and hire staff at the board. Keep customers happy to raise your ⭐ reputation.</p><p class=mut>Move: WASD / arrows / joystick. Interact: E, Space or the red button.</p></div><div class=col><button class=btn data-a=title>BACK</button></div>`)}
function pick(){S=newS();show(`<div class=ttl style="margin:2vh 0 12px"><h1 style="font-size:8vw">CHOOSE YOUR FIRST BUSINESS</h1><p>💰 ${F(50000)} starting capital</p></div>${BIZ.map(b=>`<div class="card ${b.on?'':'lock'}"><h3>${b.e} ${b.n}</h3><div class=mut>${b.d}</div><div class=row><span>Startup cost</span><b>${F(b.cost)}</b></div><div class=row><span>Difficulty</span><b>${b.diff}</b></div><div class=row><span>Avg profit</span><b>${F(b.profit)}/day</b></div>${b.on?'<button class="btn g" style="width:100%;margin-top:6px" data-a=open>OPEN FOOD STAND</button>':'<b>🔒 Coming soon</b>'}</div>`).join('')}`)}
const TABS=[['sup','📦','Supply'],['up','🔧','Upgrade'],['st','👥','Staff'],['go','🏆','Goals'],['map','🗺️','City'],['lb','🥇','Ranks'],['set','⚙️','Menu']];
